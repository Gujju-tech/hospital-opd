<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nurse Pre-test</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="page narrow">
    <section class="page-heading">
        <div>
            <p class="eyebrow" th:text="'OPD Token #' + ${visit.id}">OPD Token</p>
            <h1 th:text="'Nurse Pre-test: ' + ${visit.patient.fullName}">Nurse Pre-test</h1>
        </div>
    </section>

    <form class="panel" th:action="@{/nurse/visits/{id}/pretest(id=${visit.id})}" method="post" th:object="${visit}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="two-col">
            <label>Temperature C
                <input type="number" step="0.1" th:field="*{temperatureCelsius}">
            </label>
            <label>Pulse rate
                <input type="number" th:field="*{pulseRate}">
            </label>
        </div>
        <div class="two-col">
            <label>Blood pressure
                <input placeholder="120/80" th:field="*{bloodPressure}">
            </label>
            <label>Weight kg
                <input type="number" step="0.1" th:field="*{weightKg}">
            </label>
        </div>
        <label>Oxygen saturation %
            <input type="number" step="0.1" th:field="*{oxygenSaturation}">
        </label>
        <label>Nurse notes
            <textarea rows="5" th:field="*{nurseNotes}"></textarea>
        </label>
        <div class="form-actions">
            <a class="button ghost" th:href="@{/}">Cancel</a>
            <button class="button" type="submit">Save Pre-test</button>
        </div>
    </form>
</main>
</body>
</html>
