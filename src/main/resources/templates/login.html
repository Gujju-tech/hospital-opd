<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Hospital OPD</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="login-page">
    <form class="panel login-card" th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p class="eyebrow">Secure Access</p>
        <h1>Hospital OPD Login</h1>
        <p th:if="${param.error}" class="alert danger">Invalid username or password.</p>
        <p th:if="${param.logout}" class="alert">You have been logged out.</p>
        <label>Username
            <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button" type="submit">Login</button>
    </form>
</main>
</body>
</html>
