spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospitalopd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:hospitalopd}
spring.datasource.password=${DB_PASSWORD:hospitalopd}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.reception.username=${RECEPTION_USERNAME}
app.security.reception.password=${RECEPTION_PASSWORD}
app.security.nurse.username=${NURSE_USERNAME}
app.security.nurse.password=${NURSE_PASSWORD}
app.security.doctor.username=${DOCTOR_USERNAME}
app.security.doctor.password=${DOCTOR_PASSWORD}
